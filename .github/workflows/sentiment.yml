name: Sentiment
on:
  schedule:
    - cron: '1,11,21,31,41,51 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dfx-sentiment
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JOB: sentiment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography==43.0.3
      - run: python scripts/fetch.py sentiment
      - name: Commit
        run: |
          git config user.name "dfx-bot"; git config user.email "dfx-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "nessuna modifica"; exit 0; }
          git commit -m "dati: $JOB $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
