name: COT
on:
  schedule:
    # CFTC esce venerdi 15:30 New York = 21:30 Italia (20:30 nelle settimane di sfasamento ora legale).
    # Piu' orari UTC per coprire ora legale/solare; lo script committa solo se il report cambia.
    - cron: '35 19 * * 5'
    - cron: '35 20 * * 5'
    - cron: '45 21 * * 5'
    - cron: '30 23 * * 5'
    - cron: '0 12 * * 1,2,3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dfx-cot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JOB: cot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography==43.0.3
      - run: python scripts/fetch.py cot
      - name: Commit
        run: |
          git config user.name "dfx-bot"; git config user.email "dfx-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "nessuna modifica"; exit 0; }
          git commit -m "dati: $JOB $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
